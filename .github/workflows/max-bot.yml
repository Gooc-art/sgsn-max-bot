name: max-bot

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: self-hosted
    steps:
      - name: Update app
        run: |
          set -eu
          if [ ! -d "$HOME/sgsn-max-bot/.git" ]; then
            git clone https://github.com/Gooc-art/sgsn-max-bot.git "$HOME/sgsn-max-bot"
          fi
          git -C "$HOME/sgsn-max-bot" fetch origin main
          git -C "$HOME/sgsn-max-bot" reset --hard origin/main
      - name: Configure env
        run: |
          mkdir -p "$HOME/.config/sgsn-max-bot"
          printf 'MAX_TOKEN=%s\nMAX_API_BASE=https://platform-api2.max.ru\nSGSN_MAX_DAYS=45\nSGSN_EXPORT_TIMEOUT_SECONDS=14400\nSGSN_HTTP_TIMEOUT_SECONDS=20\n' '${{ secrets.MAX_TOKEN }}' > "$HOME/.config/sgsn-max-bot/max-bot.env"
          chmod 600 "$HOME/.config/sgsn-max-bot/max-bot.env"
      - name: Install and restart bot
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          "$HOME/sgsn-max-bot/scripts/install_max_bot_service.sh"
          systemctl --user restart sgsn-max-bot.service
          systemctl --user status sgsn-max-bot.service --no-pager
