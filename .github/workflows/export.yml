name: export

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: Start date YYYY-MM-DD
        required: true
      date_to:
        description: End date YYYY-MM-DD
        required: true
      outdir:
        description: Output directory under ~/sgsn-max-bot
        required: true
        default: output/manual-export

jobs:
  export:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Update app
        run: |
          set -eu
          git -C "$HOME/sgsn-max-bot" fetch origin main
          git -C "$HOME/sgsn-max-bot" reset --hard origin/main
      - name: Run export
        run: |
          set -eu
          cd "$HOME/sgsn-max-bot"
          mkdir -p "${{ inputs.outdir }}"
          flock -n /tmp/sgsn_export.lock timeout 75m \
            python3 sud_export.py \
              --from "${{ inputs.date_from }}" \
              --to "${{ inputs.date_to }}" \
              --outdir "${{ inputs.outdir }}" \
              --timeout 8 \
              --sort-by-lawyer
      - name: Show result
        run: |
          ls -lh "$HOME/sgsn-max-bot/${{ inputs.outdir }}"
