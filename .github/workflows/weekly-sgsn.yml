name: weekly-sgsn

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:
    inputs:
      force_send:
        description: Send test message/file even when SGSN rows are 0
        required: false
        default: "false"
      skip_export:
        description: Send from existing outdir without rebuilding
        required: false
        default: "false"
      outdir:
        description: Existing output directory
        required: false
        default: ""

jobs:
  weekly-sgsn:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Update app
        run: |
          set -eu
          git -C "$HOME/sgsn-max-bot" fetch origin main
          git -C "$HOME/sgsn-max-bot" reset --hard origin/main
          chmod +x "$HOME/sgsn-max-bot/weekly_sgsn_notify.py"
      - name: Run weekly SGSN notification
        run: |
          args=
          if [ "${{ github.event.inputs.force_send }}" = "true" ]; then
            args=--force-send
          fi
          if [ "${{ github.event.inputs.skip_export }}" = "true" ]; then
            args="$args --skip-export"
          fi
          if [ -n "${{ github.event.inputs.outdir }}" ]; then
            args="$args --outdir ${{ github.event.inputs.outdir }}"
          fi
          set -eu
          cd "$HOME/sgsn-max-bot"
          set -a
          . "$HOME/.config/sgsn-max-bot/max-bot.env"
          set +a
          flock -n /tmp/sgsn_weekly.lock timeout 75m python3 weekly_sgsn_notify.py --timeout 8 $args
