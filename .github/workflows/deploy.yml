name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy locally
        run: |
          mkdir -p "$HOME/sud-app"
          rsync -a --delete --exclude output --exclude .git ./ "$HOME/sud-app/"
          chmod +x "$HOME/sud-app/sud_export.py"
