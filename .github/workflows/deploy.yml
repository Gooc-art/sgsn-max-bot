name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy locally
        run: |
          if [ ! -d "$HOME/sud-app/.git" ]; then
            git clone https://github.com/Gooc-art/sud.git "$HOME/sud-app"
          fi
          git -C "$HOME/sud-app" fetch origin main
          git -C "$HOME/sud-app" reset --hard origin/main
          chmod +x "$HOME/sud-app/sud_export.py"
